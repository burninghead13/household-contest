<!DOCTYPE html>
<html lang="{{ get_lang() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('login_title') }}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #f1f5f9; --text-muted: #94a3b8; --accent: #6366f1; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;
        }
        .login-box {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 360px; text-align: center;
        }
        .logo { font-size: 3rem; margin-bottom: 1rem; }
        h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.75rem; }
        input {
            background: #273549; border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); padding: 0.65rem 1rem;
            font-size: 0.95rem; width: 100%; margin-bottom: 1rem; transition: border-color 0.15s;
        }
        input:focus { outline: none; border-color: var(--accent); }
        button {
            background: var(--accent); color: #fff; border: none;
            border-radius: 8px; padding: 0.65rem 1rem; font-size: 0.95rem;
            font-weight: 600; width: 100%; cursor: pointer; transition: opacity 0.15s;
        }
        button:hover { opacity: 0.9; }
        .alert { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5;
            padding: 0.6rem 0.75rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; }
        .lang-bar { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1.25rem; }
        .lang-bar a { color: var(--text-muted); font-size: 0.8rem; text-decoration: none; padding: 2px 8px;
            border-radius: 5px; font-weight: 600; }
        .lang-bar a.active { background: var(--accent); color: #fff; }
    </style>
</head>
<body>
<div class="login-box">
    <div class="logo">🏆</div>
    <h1>{{ t('login_heading') }}</h1>
    <p>{{ t('login_subtitle') }}</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for _, message in messages %}
    <div class="alert">{{ message }}</div>
    {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="password" name="password" placeholder="{{ t('login_placeholder') }}" autofocus>
        <button type="submit">{{ t('login_button') }}</button>
    </form>

    <div class="lang-bar">
        <a href="/set_lang/de" {% if get_lang() == 'de' %}class="active"{% endif %}>DE</a>
        <a href="/set_lang/en" {% if get_lang() == 'en' %}class="active"{% endif %}>EN</a>
    </div>
</div>
</body>
</html>
